<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

  const COLLECTION_NAME = "jailbreak_car_applications";
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBVv6hGs6vt0SvzJLSXFOre4YLFiymMPbY",
    authDomain: "jailbreak-car-portal.firebaseapp.com",
    projectId: "jailbreak-car-portal",
    storageBucket: "jailbreak-car-portal.firebasestorage.app",
    messagingSenderId: "436243354726",
    appId: "1:436243354726:web:232e8f8de93116dfddc9a7"
  };

  const app = initializeApp(FIREBASE_CONFIG);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let submissions = [];
  let isUnlocked = false;

  const $ = id => document.getElementById(id);
  const [visitorTabBtn, ownerTabBtn, visitorView, ownerView, carForm, robloxUsernameInput, friendNameInput, vehicleSelect, customVehicleWrap, customVehicleInput, reasonInput, formError, submitBtn, syncStatus, receiptView, receiptCodeText, copyReceiptBtn, newRequestBtn, ownerLockBox, ownerDashboard, passcodeInput, passcodeError, unlockBtn, searchInput, statusFilter, refreshBtn, exportJsonBtn, exportCsvBtn, lockBtn, clearAllBtn, ownerSummary, submissionsList] = 
    ['visitorTabBtn', 'ownerTabBtn', 'visitorView', 'ownerView', 'carForm', 'robloxUsernameInput', 'friendNameInput', 'vehicleSelect', 'customVehicleWrap', 'customVehicleInput', 'reasonInput', 'formError', 'submitBtn', 'syncStatus', 'receiptView', 'receiptCodeText', 'copyReceiptBtn', 'newRequestBtn', 'ownerLockBox', 'ownerDashboard', 'ownerEmail', 'passcodeError', 'unlockBtn', 'searchInput', 'statusFilter', 'refreshBtn', 'exportJsonBtn', 'exportCsvBtn', 'lockBtn', 'clearAllBtn', 'ownerSummary', 'submissionsList'].map($);

  syncStatus.textContent = "Connected securely to Firestore (live sync enabled).";

  const validateRobloxUsername = name => /^[A-Za-z0-9_]{3,20}$/.test(name) && !name.startsWith("_") && !name.endsWith("_") && !name.includes("__") ? "" : "Invalid Roblox Username.";
  const generateReceiptCode = () => `JB-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).substring(2, 7).toUpperCase()}`;

  async function loadSubmissions() {
    const q = query(collection(db, COLLECTION_NAME), orderBy("createdAt", "desc"));
    const snap = await getDocs(q);
    submissions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderInbox();
  }

  async function updateSubmissionStatus(id, status) {
    await updateDoc(doc(db, COLLECTION_NAME, id), { status });
    submissions = submissions.map(item => item.id === id ? { ...item, status } : item);
    renderInbox();
  }

  async function deleteSubmission(id) {
    await deleteDoc(doc(db, COLLECTION_NAME, id));
    submissions = submissions.filter(item => item.id !== id);
    renderInbox();
  }

  const escapeHtml = str => String(str ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");

  function renderInbox() {
    if (!isUnlocked) return;
    const term = searchInput.value.trim().toLowerCase();
    const statusVal = statusFilter.value;

    const filtered = submissions.filter(item => {
      const matchesStatus = statusVal === "ALL" || item.status === statusVal;
      const haystack = [item.username, item.friendName, item.vehicle, item.reason, item.receiptCode].join(" ").toLowerCase();
      return matchesStatus && (!term || haystack.includes(term));
    });

    ownerSummary.textContent = `Showing ${filtered.length} of ${submissions.length} submissions`;
    if (!filtered.length) { submissionsList.innerHTML = `<div class="subtitle">No requests.</div>`; return; }

    submissionsList.innerHTML = filtered.map(item => `
      <div class="sub-item">
        <div class="sub-header"><strong>@${escapeHtml(item.username)} → ${escapeHtml(item.vehicle)}</strong><span class="subtitle">${escapeHtml(item.receiptCode)}</span></div>
        <div class="sub-meta">
          <div><strong>Friend:</strong> ${escapeHtml(item.friendName || "None")}</div>
          <div><strong>Reason:</strong> ${escapeHtml(item.reason || "None")}</div>
        </div>
        <div class="sub-actions">
          <select data-action="status" data-id="${escapeHtml(item.id)}">
            ${["Pending", "Approved", "Fulfilled", "Declined"].map(st => `<option value="${st}" ${item.status === st ? "selected" : ""}>${st}</option>`).join("")}
          </select>
          <button type="button" class="secondary" data-action="copy" data-username="${escapeHtml(item.username)}">Copy User</button>
          <button type="button" class="danger" data-action="delete" data-id="${escapeHtml(item.id)}">Delete</button>
        </div>
      </div>
    `).join("");
  }

  visitorTabBtn.addEventListener("click", () => { visitorView.classList.remove("hidden"); ownerView.classList.add("hidden"); });
  ownerTabBtn.addEventListener("click", () => { visitorView.classList.add("hidden"); ownerView.classList.remove("hidden"); if (isUnlocked) loadSubmissions(); });
  vehicleSelect.addEventListener("change", () => customVehicleWrap.classList.toggle("hidden", vehicleSelect.value !== "Custom"));

  carForm.addEventListener("submit", async (e) => {
    e.preventDefault(); formError.textContent = "";
    const username = robloxUsernameInput.value.trim();
    const finalVehicle = vehicleSelect.value === "Custom" ? customVehicleInput.value.trim() : vehicleSelect.value;
    const err = validateRobloxUsername(username) || (!finalVehicle ? "Choose a vehicle" : "");
    if (err) { formError.textContent = err; return; }

    submitBtn.disabled = true;
    try {
      const code = generateReceiptCode();
      await addDoc(collection(db, COLLECTION_NAME), {
        username, friendName: friendNameInput.value.trim(), vehicle: finalVehicle, reason: reasonInput.value.trim(),
        status: "Pending", receiptCode: code, createdAt: new Date().toISOString()
      });
      receiptCodeText.textContent = code; carForm.classList.add("hidden"); receiptView.classList.remove("hidden");
    } catch (e) { formError.textContent = e.message; }
    submitBtn.disabled = false;
  });

  copyReceiptBtn.addEventListener("click", () => { navigator.clipboard.writeText(receiptCodeText.textContent); copyReceiptBtn.textContent = "Copied!"; setTimeout(() => copyReceiptBtn.textContent = "Copy Receipt ID", 1500); });
  newRequestBtn.addEventListener("click", () => { carForm.reset(); customVehicleWrap.classList.add("hidden"); receiptView.classList.add("hidden"); carForm.classList.remove("hidden"); });

  onAuthStateChanged(auth, user => {
    isUnlocked = !!user; ownerLockBox.classList.toggle("hidden", isUnlocked); ownerDashboard.classList.toggle("hidden", !isUnlocked);
    if (user) loadSubmissions();
  });

  unlockBtn.addEventListener("click", () => {
    passcodeError.textContent = "";
    signInWithEmailAndPassword(auth, $('ownerEmail').value, $('ownerPassword').value).catch(e => passcodeError.textContent = e.message);
  });

  lockBtn.addEventListener("click", () => signOut(auth));
  refreshBtn.addEventListener("click", loadSubmissions);
  searchInput.addEventListener("input", renderInbox);
  statusFilter.addEventListener("change", renderInbox);

  submissionsList.addEventListener("change", async e => { if (e.target.dataset.action === "status") await updateSubmissionStatus(e.target.dataset.id, e.target.value); });
  submissionsList.addEventListener("click", async e => {
    const btn = e.target.closest("button"); if (!btn) return;
    if (btn.dataset.action === "copy") { navigator.clipboard.writeText(btn.dataset.username); btn.textContent = "Copied!"; setTimeout(() => btn.textContent = "Copy User", 1200); }
    if (btn.dataset.action === "delete") await deleteSubmission(btn.dataset.id);
  });

  const downloadFile = (file, data, type) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = file; a.click(); };
  exportJsonBtn.addEventListener("click", () => downloadFile("jailbreak.json", JSON.stringify(submissions, null, 2), "application/json"));
  exportCsvBtn.addEventListener("click", () => {
    const heads = ["receiptCode", "username", "friendName", "vehicle", "status", "reason", "createdAt"];
    const rows = submissions.map(s => heads.map(h => `"${String(s[h] ?? "").replaceAll('"', '""')}"`).join(","));
    downloadFile("jailbreak.csv", [heads.join(","), ...rows].join("\n"), "text/csv");
  });
  clearAllBtn.addEventListener("click", async () => {
    if (confirm("Clear all submissions?")) {
      const snap = await getDocs(collection(db, COLLECTION_NAME));
      await Promise.all(snap.docs.map(d => deleteDoc(doc(db, COLLECTION_NAME, d.id))));
      submissions = []; renderInbox();
    }
  });
</script>
